name: Deploy Main

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST_LIVE }}
          username: ${{ secrets.VPS_USER_LIVE }}
          key: ${{ secrets.VPS_SSH_KEY_LIVE }}
          script: |
            cd /opt/jee1live

            echo "Updating repository..."
            ./deploy.sh adminfrontendlive

            docker image prune -f

            echo "Deployment completed successfully"
